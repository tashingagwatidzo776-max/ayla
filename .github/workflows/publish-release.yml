name: Publish release asset

# Closes the last manual gap in the release chain: the tag workflow leaves
# the built exe as a run artifact, and the release page (draft → verify →
# publish) was assembled by hand from a local download. This job attaches
# the tag's artifact to the release from GitHub's own infrastructure —
# Actions → Actions — so shipping no longer depends on the operator's link
# to the blob host (a throttled or offline local connection can no longer
# strand a release).
#
# Dispatch: Actions → Publish release asset → Run workflow → tag (and
# optionally the gate-drill run id; defaults to the latest successful run
# on that tag). Idempotent: re-runs replace the existing asset (--clobber).
# The draft→published decision stays with the human, per the runbook.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose built exe should be attached (e.g. v0.0.2)'
        required: true
        type: string
      run_id:
        description: 'Optional gate-drill run id holding the artifact (defaults to the latest successful run on that tag)'
        required: false
        type: string

permissions:
  contents: write # upload the asset to the release

env:
  # Bare `gh run download` / `gh release upload` infer the repo from git
  # remotes — and this job deliberately has no checkout, so without GH_REPO
  # every gh call dies with "fatal: not a git repository".
  GH_REPO: ${{ github.repository }}

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Resolve the tag's gate-drill run
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
        RUN_ID: ${{ inputs.run_id }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_ID" ]; then
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TAG&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "Real-money gate drill")][0].id')
        fi
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "::error::no successful gate-drill run found for tag $TAG"
          exit 1
        fi
        echo "source run: $RUN_ID"
        echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

    - name: Download the built exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        gh run download "$RUN_ID" --name "DongGfx-$TAG-win-x64" --dir dist
        test -f dist/DongGfx.exe || { echo "::error::dist/DongGfx.exe missing from the artifact"; exit 1; }
        ls -la dist/

    - name: Verify the binary's version stamp matches the release tag
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # The stamp is UTF-16 in the PE (window title / About identity):
        if ! strings -e l dist/DongGfx.exe | grep -qF "$TAG+"; then
          echo "::error::DongGfx.exe does not carry the $TAG+ version stamp"
          exit 1
        fi
        echo "stamp verified: $TAG+…"
        sha256sum dist/DongGfx.exe | tee sha256.txt
        echo "### 📦 Release asset for \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat sha256.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"

    - name: Attach to the release (idempotent)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # `releases/tags/<tag>` never returns DRAFTS (a draft has no tag ref
        # yet) — discover the release through the list endpoint instead,
        # which sees drafts, then work by release id from there.
        RID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
          --jq "[.[] | select(.tag_name == \"$TAG\")][0].id" \
        )
        if [ -z "$RID" ] || [ "$RID" = "null" ]; then
          echo "::error::no release (draft or published) exists for $TAG — create the draft first"
          exit 1
        fi
        echo "release id: $RID"
        # Idempotency: drop a previous DongGfx.exe asset first so the POST below
        # is a replace, not a 422 duplicate-name error (this is --clobber).
        for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '.assets[] | select(.name == "DongGfx.exe") | .id'); do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"
          echo "replaced existing asset $AID"
        done
        # gh release upload resolves by tag and cannot see drafts, so POST
        # the asset directly to the release's upload_url. --fail-with-body
        # is mandatory: without it a server-side upload error ("Error
        # creating asset temp dir", seen live on the v0.0.3 dispatch)
        # prints an error body but exits 0 — a silent missing asset.
        UPLOAD_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '.upload_url' | sed 's/{.*}//')?name=DongGfx.exe"
        EXPECTED=$(stat -c%s dist/DongGfx.exe)
        ok=0
        for attempt in 1 2 3; do
          if curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @dist/DongGfx.exe \
              "$UPLOAD_URL"; then
            ok=1
            break
          fi
          echo "upload attempt $attempt failed — retrying in 30s (transient asset-service errors have been seen live)"
          # drop a half-written asset before retrying, or the next POST 422s
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '.assets[] | select(.name == "DongGfx.exe") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" || true
          done
          sleep 30
        done
        if [ "$ok" != "1" ]; then
          echo "::error::asset upload failed after 3 attempts"
          exit 1
        fi
        # The upload is only real when the asset exists at the exact size
        # the runner sent — verify before declaring success.
        ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '[.assets[] | select(.name == "DongGfx.exe")][0].size // 0')
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::uploaded asset is $ACTUAL bytes, expected $EXPECTED — upload did not land"
          exit 1
        fi
        echo "### Release state after attach" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        gh api "repos/$GITHUB_REPOSITORY/releases/$RID" \
          --jq '{draft, assets: [.assets[] | {name, size, state}]}' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Attach the updater package (zip) and announce its SHA-256
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # The updater's update check only recognizes assets whose name
        # contains "win-x64" and ends in ".zip", and its hardened download
        # path verifies the package against a sha256 line announced in the
        # release notes. Zip the exe, attach that package, and PATCH the
        # body with the announcement. The name MUST stay the canonical
        # DongGfx-win-x64.zip the tag-triggered release.yml ships — a
        # second, differently-named zip would give the updater's
        # first-match filter two candidates on the same release.
        ZIP_NAME="DongGfx-win-x64.zip"
        zip -j -q "dist/$ZIP_NAME" dist/DongGfx.exe
        ZIP_SHA256=$(sha256sum "dist/$ZIP_NAME" | awk '{print $1}')
        echo "package: $ZIP_NAME (sha256 $ZIP_SHA256)"

        RID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
          --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
        if [ -z "$RID" ] || [ "$RID" = "null" ]; then
          echo "::error::no release (draft or published) exists for $TAG"
          exit 1
        fi

        # Idempotent (--clobber): replace a previous zip asset first.
        for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .id"); do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"
          echo "replaced existing asset $AID"
        done
        UPLOAD_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '.upload_url' | sed 's/{.*}//')?name=$ZIP_NAME"
        EXPECTED=$(stat -c%s "dist/$ZIP_NAME")
        ok=0
        for attempt in 1 2 3; do
          if curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"dist/$ZIP_NAME" \
              "$UPLOAD_URL"; then
            ok=1
            break
          fi
          echo "zip upload attempt $attempt failed — retrying in 30s"
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" || true
          done
          sleep 30
        done
        if [ "$ok" != "1" ]; then
          echo "::error::zip asset upload failed after 3 attempts"
          exit 1
        fi
        ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq "[.assets[] | select(.name == \"$ZIP_NAME\")][0].size // 0")
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::uploaded zip is $ACTUAL bytes, expected $EXPECTED — upload did not land"
          exit 1
        fi

        # Announce the checksum in the release notes — the updater parses
        # "sha256: <hex>  <asset-name>" from the body (and ignores hex
        # lines naming a different asset). Idempotent: previously announced
        # lines are stripped before appending, so re-runs never duplicate.
        BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq '.body // ""')
        BODY=$(printf '%s' "$BODY" | sed '/^sha256:/Id')
        NEWBODY=$(printf '%s\n\n## Verify the download\n\nsha256: %s  %s\n' "$BODY" "$ZIP_SHA256" "$ZIP_NAME")
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" -f body="$NEWBODY" > /dev/null
        echo "announced sha256 of $ZIP_NAME in the release notes"
        echo "### 📦 Updater package" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "$ZIP_NAME  sha256:$ZIP_SHA256" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
