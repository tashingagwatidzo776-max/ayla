name: Weekly drills

# Rehearsed paths decay silently if nobody remembers to run them. This
# wrapper dispatches the CI pipeline's drill legs (drift alert fail/resolve
# cycle and the staleness flag) on a weekly schedule so both stay live-proven
# against the real API, and — if the drill run fails — files the failure
# through the same drift-alert machinery the nightly uses (label `ci-drills`)
# with log-excerpt classification, so a broken rehearsal is triaged like any
# other drift instead of noticed by accident.

on:
  schedule:
    - cron: '41 5 * * 3' # Wednesdays 05:41 UTC — clear of the Monday 06:23 health check, the 03:17 nightly, and the 06:00 watchdog
  workflow_dispatch:
    inputs:
      drift_drill:
        description: 'Include the drift-alert drill (fail/resolve cycle)'
        type: boolean
        default: true
      stale_drill:
        description: 'Also rehearse the staleness flag (requires the drift drill)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # dispatch the CI workflow and read the dispatched run

jobs:
  weekly-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Dispatch the drill run and confirm it registered
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        repo="${{ github.repository }}"
        event="${{ github.event_name }}"
        want_drift=true
        want_stale=true
        if [ "$event" = "workflow_dispatch" ]; then
          want_drift=${{ inputs.drift_drill == true && 'true' || 'false' }}
          want_stale=${{ inputs.stale_drill == true && 'true' || 'false' }}
        fi
        # The staleness leg lives inside the drift-drill job — stale implies drift.
        if [ "$want_stale" = "true" ]; then want_drift="true"; fi
        if [ "$want_drift" != "true" ]; then
          echo "Both drills deselected — nothing to rehearse."
          echo "run_id=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Which leg will this week's auto-mode drill pick? Same probe as
        # ci.yml's drift-drill step (open drill issue → resolve, none → fail),
        # recorded BEFORE dispatching so the wait step can verify the whole
        # alert→green→close lifecycle against the expected half of the cycle.
        open_before=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=ci-drift-drill&per_page=1" --jq '.[0].number // empty')
        echo "mode=$([ -n "$open_before" ] && echo resolve || echo fail)" >> "$GITHUB_OUTPUT"
        echo "Expected drill leg: $([ -n "$open_before" ] && echo resolve || echo fail) (open drill issue before dispatch: ${open_before:-none})"

        args=(--ref main)
        args+=(-f drift_drill=true -f drift_drill_mode=auto)
        if [ "$want_stale" = "true" ]; then args+=(-f stale_drill=true); fi
        gh workflow run ci.yml --repo "$repo" "${args[@]}"
        echo "Drill run dispatched on main: drift=$want_drift stale=$want_stale"

        # Registration check — this repo has seen silent non-delivery before.
        run_id=""
        for i in $(seq 1 12); do
          sleep 10
          run_id=$(gh run list --repo "$repo" --workflow CI \
            --event workflow_dispatch --created ">$(date -u -d '-3 minutes' +%Y-%m-%dT%H:%M:%SZ)" \
            --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          [ -n "$run_id" ] && break
        done
        if [ -z "$run_id" ]; then
          echo "::error::Dispatched drill run did not register within 2 minutes — delivery path is broken"
          exit 1
        fi
        echo "Confirmed: drill run $run_id is registered."
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Wait for the drill run, verify the lifecycle, record the verdict
      id: wait
      if: ${{ steps.dispatch.outputs.run_id != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        MODE: ${{ steps.dispatch.outputs.mode }}
      run: |
        repo="${{ github.repository }}"
        for i in $(seq 1 30); do
          sleep 60
          status=$(gh run view "$RUN_ID" --repo "$repo" --json status -q .status 2>/dev/null || echo unknown)
          [ "$status" = "completed" ] && break
        done
        conclusion=$(gh run view "$RUN_ID" --repo "$repo" --json conclusion -q '.conclusion // "unknown"' 2>/dev/null || echo unknown)
        echo "drill run $RUN_ID verdict: $conclusion"

        # The drill must not just pass — the alert lifecycle must alternate.
        # Auto mode picks one half each week: fail opens/updates the drill
        # alert and leaves it open; resolve posts the green note and closes
        # it. If that cycle ever stops alternating (a leg silently no-ops,
        # close-keyword text falsely closes, the green note goes missing),
        # the wrapper fails loudly and files a triage issue below.
        if [ "$conclusion" = "success" ]; then
          label=ci-drift-drill
          open_after=$(gh api "repos/$repo/issues?state=open&labels=$label&per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)
          # Newest closed rehearsal issue, skipping the staleness throwaway
          # (created and closed inside the same drill run on purpose).
          closed=$(gh api "repos/$repo/issues?state=closed&labels=$label&per_page=20" \
            --jq '.[] | select(.title == "[Drill] Nightly CI drift alert rehearsal") | .number' 2>/dev/null | head -1 || true)
          green=0
          if [ -n "$closed" ]; then
            comments=$(gh api "repos/$repo/issues/$closed/comments" --paginate --jq '.[].body' 2>/dev/null || true)
            case "$comments" in *"<!-- $label-green -->"*) green=1 ;; esac
          fi
          problems=""
          if [ "$MODE" = "fail" ]; then
            if [ -z "$open_after" ]; then
              problems="fail leg did not leave the drill alert issue open; "
            fi
          fi
          if [ "$MODE" = "resolve" ]; then
            if [ -n "$open_after" ]; then
              problems="resolve leg left a drill alert issue open (#$open_after); "
            fi
            if [ "$green" = "0" ]; then
              problems="${problems}no green note on the closed drill issue (#${closed:-none}); "
            fi
          fi
          if [ -n "$problems" ]; then
            echo "::error::Drill lifecycle incomplete: ${problems}(mode=$MODE, run $RUN_ID)"
            echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Drill lifecycle verified (mode=$MODE): open alert=${open_after:-none}, closed=#${closed:-none}, green note=$green"
        fi

        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        if [ "$conclusion" != "success" ]; then
          echo "::error::Weekly drill run $RUN_ID finished as '$conclusion' — filing a triage issue"
          exit 1
        fi

    - name: Check out the alert script
      if: failure()
      uses: actions/checkout@v7

    - name: File the drill failure as a triage issue
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: fail
        DRILL_LABEL: ci-drills
        ISSUE_TITLE: 'Weekly drill run failed'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        FAILING_JOBS: 'weekly drill run (drift alert or staleness rehearsal)'
        GH_RUN_ID: ${{ steps.wait.outputs.run_id }}
      run: bash scripts/drift-alert.sh
