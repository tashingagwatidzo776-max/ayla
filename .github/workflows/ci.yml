name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly drift check: catches breakage that only shows up when the world
  # moves — runner-image and dotnet SDK updates, and the Python bridge
  # tooling. The odd minute keeps it off the
  # top-of-hour schedule crunch.
  schedule:
    - cron: '17 3 * * *'
  # Schedules cannot be fired manually, so this dispatch hook exists to
  # exercise the same pipeline on demand (e.g. right after a runner-image
  # update lands). inputs.drift_drill additionally rehearses the drift-alert
  # path (open/update/close the ci-drift-drill issue) without waiting for
  # real drift.
  workflow_dispatch:
    inputs:
      drift_drill:
        description: 'Drift drill: simulate a failing scheduled run to rehearse the alert'
        type: boolean
        default: false
      drift_drill_mode:
        description: 'Drill mode (auto: resolve when a drill issue is open, else open one)'
        type: choice
        default: auto
        options: [auto, fail, resolve]
      stale_drill:
        description: 'Staleness drill: also rehearse the watchdog 48h staleness flag (requires Drift drill enabled)'
        type: boolean
        default: false
      health_check:
        description: 'CI health check: run the full pipeline on demand; failures alert like a scheduled run'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # download the baseline coverage artifact from main's last run
  pull-requests: write # post/update the coverage-diff PR comment
  issues: write # drift-alert opens/updates/closes the nightly drift issue

jobs:
  unit:
    runs-on: windows-latest
    # A hung test must die here, not burn the 6-hour default. The blame-hang
    # flag then writes a sequence attachment naming the exact test that hung,
    # uploaded with the crash dumps below.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    # The repo carries a SHA-256 manifest for the portable MT5 terminal it
    # ships beside the code (mt5_portable/ is git-ignored: two of its
    # executables exceed GitHub's 100 MB per-file limit). Runners hold the
    # manifest but not the terminal, so here this proves the manifest is
    # present and parses; on any checkout that DOES carry the terminal the
    # same command fails the run when a file is modified, missing or
    # unexpected versus the source install it was copied from.
    - name: MT5 copy integrity
      shell: pwsh
      run: ./scripts/mt5_copy_integrity.ps1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # One automatic retry: a suite that passes elsewhere but flakes on a
    # runner (timing, listener races) must not block a PR. The retry
    # re-collects coverage, overwriting the failed attempt's files.
    - name: Test (Unit)
      shell: pwsh
      run: |
        dotnet test --no-build --configuration Release --verbosity normal --filter "Category=Unit" --collect:"XPlat Code Coverage" --results-directory ./coverage --blame-hang --blame-hang-timeout 8m --blame-crash
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::Unit tests failed on the first attempt - retrying once (flake guard)"
          dotnet test --no-build --configuration Release --verbosity normal --filter "Category=Unit" --collect:"XPlat Code Coverage" --results-directory ./coverage --blame-hang --blame-hang-timeout 8m --blame-crash
          exit $LASTEXITCODE
        }

    - name: Upload blame artifacts (Unit)
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: blame-unit
        path: ./coverage/**
        if-no-files-found: ignore

    - name: Upload coverage artifact (Unit)
      uses: actions/upload-artifact@v7
      with:
        name: coverage-unit
        path: ./coverage/**/coverage.cobertura.xml
        if-no-files-found: warn

  # The order path moves real money, so its Python transport gets its own
  # gate here: the bridge sidecar's contract tests (bad action/type pairs,
  # off-step lots, unknown symbols and closed markets must be refused BEFORE
  # anything reaches the terminal) and the soak-report verdict tests. These
  # are the only test suites CI runs outside the .NET `Category=Unit` set —
  # they need no MT5 terminal, no network, and no sockets beyond one
  # loopback round-trip. The job keeps the historical `integration` name so
  # existing required-status-check configs keep matching.
  integration:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Test the MT5 bridge sidecar contract (order-path rails)
      run: python bridge/test_mt5_sidecar.py

    - name: Test the soak-report verdicts (go-live evidence path)
      run: python scripts/test_soak_report.py

  # Merges both jobs' cobertura files into one HTML report and gates the
  # build on a minimum line-coverage floor (measured at 53.2% when the
  # gate was introduced; 52% stays below the baseline with headroom for
  # run-to-run variance while still catching real regressions).
  coverage-report:
    runs-on: windows-latest
    needs: [unit, integration]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Download coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        path: ./coverage
        merge-multiple: true

    - name: Restore dotnet tools
      run: dotnet tool restore

    # bash: pwsh mangles -name:"value" into two arguments, which
    # ReportGenerator rejects with "No report files specified".
    - name: Generate merged HTML coverage report
      shell: bash
      run: dotnet tool run reportgenerator -- -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/report" -reporttypes:"HtmlInline_AzurePipelines;TextSummary"

    # Rebuild the coverage history for the Pages trend chart: pull the
    # Summary.txt out of each recent successful main run's coverage-report
    # artifact, add this run's own numbers, and emit a tiny CSV that the
    # Coverage Pages workflow turns into a chart. Deliberately placed before
    # the 60% gate step so the history is still uploaded when the gate fails.
    - name: Rebuild coverage history
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ./trend
        printf 'epoch_seconds,run_id,line_coverage\n' > ./trend/coverage-trend.csv
        this_pct=$(grep -E '^  Line coverage:' ./coverage/report/Summary.txt | awk '{print $3}' | tr -d '%')
        printf '%s,%s,%s\n' "$(date +%s)" "${{ github.run_id }}" "$this_pct" >> ./trend/coverage-trend.csv

        # Older runs, newest first; keep the 30 most recent data points.
        run_ids=$(gh run list --repo "${{ github.repository }}" \
          --workflow CI --branch main --event push --status success --limit 31 \
          --json databaseId --jq '.[].databaseId')
        for id in $run_ids; do
          [ "$id" = "${{ github.run_id }}" ] && continue
          rm -rf ./history && mkdir -p ./history
          if gh run download "$id" --repo "${{ github.repository }}" --name coverage-report -D ./history 2>/dev/null \
             && [ -f ./history/Summary.txt ]; then
            pct=$(grep -E '^  Line coverage:' ./history/Summary.txt | awk '{print $3}' | tr -d '%')
            [ -n "$pct" ] || continue
            created=$(gh run view "$id" --repo "${{ github.repository }}" --json createdAt --jq .createdAt)
            ts=$(date -d "$created" +%s)
            printf '%s,%s,%s\n' "$ts" "$id" "$pct" >> ./trend/coverage-trend.csv
            echo "history point: run $id -> ${pct}%"
          fi
        done
        sort -t, -k1 -n -o ./trend/coverage-trend.csv ./trend/coverage-trend.csv
        cat ./trend/coverage-trend.csv

    - name: Enforce minimum line coverage (60%)
      shell: bash
      run: |
        pct=$(grep -E '^  Line coverage:' ./coverage/report/Summary.txt | awk '{print $3}' | tr -d '%')
        echo "Combined line coverage: ${pct}% (minimum 60%)"
        awk -v p="$pct" 'BEGIN { exit (p+0 < 60) }' || {
          echo "::error::Line coverage ${pct}% is below the 60% gate"
          exit 1
        }

    # Diff this PR's merged coverage against the last successful CI run on
    # main so regressions are visible in-thread before merging. One comment
    # per PR, updated in place on every push instead of stacking new ones.
    - name: Resolve baseline coverage run on main
      id: baseline
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" \
          --workflow CI --branch main --event push --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId // empty')
        echo "baseline_run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Baseline CI run on main: ${run_id:-none}"

    - name: Download baseline coverage artifact
      if: github.event_name == 'pull_request' && steps.baseline.outputs.baseline_run_id != ''
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ steps.baseline.outputs.baseline_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        name: coverage-report
        path: ./coverage/base

    # Runs even when the 60% gate fails (!cancelled), so a failing PR still
    # gets its numbers posted.
    - name: Post coverage-diff comment on the PR
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        summary=./coverage/report/Summary.txt
        [ -f "$summary" ] || { echo "No coverage summary produced; skipping comment"; exit 0; }
        pct=$(grep -E '^  Line coverage:' "$summary" | awk '{print $3}' | tr -d '%')
        [ -n "$pct" ] || { echo "Could not parse head coverage; skipping comment"; exit 0; }

        base=""
        if [ -f ./coverage/base/Summary.txt ]; then
          base=$(grep -E '^  Line coverage:' ./coverage/base/Summary.txt | awk '{print $3}' | tr -d '%')
        fi

        gate_icon="🔴"; [ "$(awk -v p="$pct" 'BEGIN { print (p+0 >= 60) }')" = "1" ] && gate_icon="✅"
        run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        {
          echo "## 📊 Coverage report"
          echo ""
          echo "| | Line coverage |"
          echo "|---|---|"
          echo "| This PR | ${pct}% (gate 60% ${gate_icon}) |"
          if [ -n "$base" ]; then
            base_run="${{ steps.baseline.outputs.baseline_run_id }}"
            base_url="https://github.com/${{ github.repository }}/actions/runs/$base_run"
            echo "| main (CI run [$base_run]($base_url)) | ${base}% |"
            delta=$(awk -v h="$pct" -v b="$base" 'BEGIN { printf "%+.1f", h - b }')
            icon="🟢"; [ "$(awk -v d="$delta" 'BEGIN { print (d+0 < 0) }')" = "1" ] && icon="🔴"
            echo "| Δ vs main | **${delta}%** ${icon} |"
          else
            echo "| main | *no baseline available yet* |"
          fi
          echo ""
          site="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY##*/}/trend.html"
          echo 'Merged line coverage of the `unit` run. Full HTML report: the `coverage-report` [artifact]('"$run_url"') of this run. Trend over time: the [coverage history page]('"$site"').'
          echo "<!-- coverage-diff -->"
        } > comment.md
        cat comment.md

        number="${{ github.event.pull_request.number }}"
        repo="${{ github.repository }}"
        comment_id=$(gh api "repos/$repo/issues/$number/comments" \
          --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("coverage-diff")) | .id' | tail -1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          echo "Updated coverage comment $comment_id"
        else
          gh pr comment "$number" --repo "$repo" --body-file comment.md
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage/report/

    - name: Upload coverage trend history
      uses: actions/upload-artifact@v7
      with:
        name: coverage-trend
        path: ./trend/coverage-trend.csv
        if-no-files-found: warn

  # Nightly drift sentinel: a scheduled run failing usually means the *world*
  # changed (runner image, SDK, upstream API) rather than a PR, so a quiet
  # red X on Actions would go unnoticed. Post an open issue with the run link
  # and failing jobs; update it if a later scheduled run fails too; when a
  # scheduled run goes green, record it with a keyword-safe 'went green'
  # note and leave the issue open for human takedown (the job is skipped on
  # push/PR runs, so they never touch the issue).
  drift-alert:
    if: ${{ !cancelled() && failure() && github.event_name == 'schedule' }}
    needs: [unit, integration, coverage-report]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Open or update the drift issue
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: fail
        DRILL_LABEL: ci-drift
        ISSUE_TITLE: 'Nightly CI drift alert: scheduled run is failing'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        export FAILING_JOBS=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd ', ' -)
        bash scripts/drift-alert.sh

  drift-resolved:
    if: ${{ !cancelled() && success() && github.event_name == 'schedule' }}
    needs: [unit, integration, coverage-report]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Post 'run went green' note on the drift issue
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: resolve
        DRILL_LABEL: ci-drift
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        DRIFT_RESOLVE_CLOSE: '0' # record health, never auto-close: visibility must not depend on closing-keyword detection
      run: bash scripts/drift-alert.sh

  # Scheduler-independent drift coverage: GitHub delivers schedule events on
  # a best-effort basis (three consecutive armed slots here were dropped or
  # fired >1h late), so the nightly cron alone cannot be trusted to catch
  # drift. Dispatching a run with the "CI health check" input runs the same
  # pipeline on demand; a failure alerts exactly like a scheduled run would
  # — same issue, same log-excerpt classification. Flake detection is
  # disabled (DRIFT_NO_FLAKE=1): an earlier green run on the same commit
  # means nothing about the environment *now*, and mislabeling real drift as
  # a known flake could throttle the alert into silence.
  ci-health-check:
    if: ${{ !cancelled() && failure() && github.event_name == 'workflow_dispatch' && inputs.health_check }}
    needs: [unit, integration, coverage-report]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Open or update the drift issue
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: fail
        DRILL_LABEL: ci-drift
        ISSUE_TITLE: 'Nightly CI drift alert: scheduled run is failing'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
        DRIFT_NO_FLAKE: '1'
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        export FAILING_JOBS=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd ', ' -)
        bash scripts/drift-alert.sh

  # Green half of the health check: a passing dispatched run records the
  # same keyword-safe 'run went green' note drift-resolved posts for the
  # nightly, so a manual/weekly health check provides recovery visibility
  # even when the scheduler never delivers the nightly slot. No-op when no
  # drift issue is open (resolve mode handles the empty case itself).
  ci-health-check-green:
    if: ${{ !cancelled() && success() && github.event_name == 'workflow_dispatch' && inputs.health_check }}
    needs: [unit, integration, coverage-report]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Post 'run went green' note on the drift issue
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: resolve
        DRILL_LABEL: ci-drift
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        DRIFT_RESOLVE_CLOSE: '0' # record health, never auto-close: visibility must not depend on closing-keyword detection
      run: bash scripts/drift-alert.sh

  # On-demand rehearsal of the drift-alert path (Actions → CI → Run workflow
  # → "Drift drill"): simulates the alert side of a failing (or, via a second
  # drill on an open issue, a green) scheduled run using the ci-drift-drill
  # label, leaving the real ci-drift issue untouched. Runs standalone (no
  # needs) so a rehearsal takes minutes instead of a full CI cycle — the CI
  # chain itself is verified by every push and PR. Skipped for every other
  # event.
  drift-drill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.drift_drill }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Decide drill mode
      id: probe
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MODE_INPUT: ${{ inputs.drift_drill_mode }}
      run: |
        # 'auto' resolves when a drill issue is already open and opens/updates
        # one otherwise; fail/resolve force a specific leg of the cycle.
        if [ "$MODE_INPUT" != "auto" ]; then
          echo "mode=$MODE_INPUT" >> "$GITHUB_OUTPUT"
          echo "Drill mode (forced): $MODE_INPUT"
          exit 0
        fi
        # REST issues list, not the search-backed `gh issue list`: the search
        # index lags creation, and this probe runs moments after a drill leg
        # may have created/opened an issue.
        open=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=ci-drift-drill&per_page=1" --jq '.[0].number // empty')
        echo "mode=$([ -n "$open" ] && echo resolve || echo fail)" >> "$GITHUB_OUTPUT"
        echo "Drill mode: $([ -n "$open" ] && echo resolve || echo fail)"
    - name: Rehearse the drift alert
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRIFT_MODE: ${{ steps.probe.outputs.mode }}
        DRILL_LABEL: ci-drift-drill
        ISSUE_TITLE: '[Drill] Nightly CI drift alert rehearsal'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
        FAILING_JOBS: 'unit, integration (simulated by the drift drill)'
        # resolve-mode drills rehearse the complete cycle: post the green note
        # AND take the drill issue down (the real drift-resolved job leaves the
        # issue open; the drill must still prove the close path works).
        DRIFT_RESOLVE_CLOSE: '1'
      run: bash scripts/drift-alert.sh

    # Rehearses the watchdog's staleness verdict against a real issue — the
    # same drill-issue isolation as the drift drill (ci-drift-drill label,
    # real ci-drift issue never touched). Two legs, so one drill visit
    # exercises both branches of the flag logic against the real API:
    #   leg 1  STALE_HOURS=0    threshold 0h forces the flag branch (the note
    #                           is posted even on a just-commented issue)
    #   leg 2  STALE_HOURS huge threshold above any real age forces the
    #                           fresh no-op branch
    # (The third branch — no open issue — is the watchdog's daily live state
    # and was proven on real runs already.)
    - name: Rehearse the staleness flag
      if: ${{ inputs.stale_drill }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        repo="${{ github.repository }}"
        # The flag only acts on an OPEN drill issue; guarantee the flag branch
        # is exercised by creating a throwaway issue when none is open (and
        # closing only that one afterwards — a pre-existing drill issue from
        # the fail leg above is left to its own resolve lifecycle).
        gh label create ci-drift-drill --repo "$repo" --color D93F0B --force >/dev/null 2>&1 || true
        existing=$(gh api "repos/$repo/issues?state=open&labels=ci-drift-drill&per_page=1" --jq '.[0].number // empty')
        created=""
        if [ -z "$existing" ]; then
          url=$(gh issue create --repo "$repo" \
            --title '[Drill] Staleness rehearsal issue' \
            --body 'Temporary issue created by the staleness drill so the 48h flag path can be rehearsed against a real issue; closed by the drill itself.' \
            --label ci-drift-drill)
          existing=${url##*/}
          created="$existing"
          echo "created throwaway drill issue #$existing"
        else
          echo "reusing open drill issue #$existing"
        fi
        echo "== leg 1: forced flag (STALE_HOURS=0) =="
        DRIFT_MODE=stale DRILL_LABEL=ci-drift-drill STALE_HOURS=0 bash scripts/drift-alert.sh
        echo "== leg 2: forced fresh no-op (threshold above any real age) =="
        DRIFT_MODE=stale DRILL_LABEL=ci-drift-drill STALE_HOURS=999999 bash scripts/drift-alert.sh
        if [ -n "$created" ]; then
          gh issue close "$created" --repo "$repo" \
            --comment 'Staleness drill complete: the flag leg and the fresh no-op leg both ran against a real issue; taking the throwaway issue down.'
          echo "closed throwaway drill issue #$created"
        fi

  # Static lint for this repo's automation bug classes (the ones that
  # produced real failed watchdog runs): invalid `gh --json` field names,
  # undeclared or unvalidated workflow_dispatch inputs, and script callers
  # missing a script's required env vars. Fast, no .NET toolchain needed.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Lint workflows and scripts
      run: |
        python3 -m pip install --quiet pyyaml
        python3 scripts/lint_workflows.py
    # Safety-rail coverage gate: every file that can place a real MT5 order
    # (a .PlaceOrderAsync call site) must have a coverage entry — naming its
    # rails — in docs/real-money-safety-audit.md. Fails the PR the moment a
    # new trade path appears without its audit section.
    - name: Check safety-audit coverage of BuyAsync call sites
      run: python3 scripts/check_safety_audit.py
    - name: Check rail-test trait coverage (gate drill selects by trait)
      run: python3 scripts/check_rail_traits.py
    # A {StaticResource Key} that no scanned file declares cannot fail the
    # C# build — it throws XamlParseException on first window load, i.e. on
    # the user's machine (PR #77 shipped exactly that). Guard it here.
    - name: Check XAML StaticResource references resolve
      run: python3 scripts/check_xaml_resources.py

  # On PRs: diff the safety-audit coverage table against main so rail
  # changes are visible in-thread before merge — the same update-in-place
  # marker-comment pattern the coverage report uses. Pushes to main skip it
  # (nothing to diff against).
  safety-audit-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Compute PR audit hash
      id: pr
      run: |
        table=$(python3 - <<'PY'
        import sys
        sys.path.insert(0, 'scripts')
        from check_safety_audit import DOC
        text = DOC.read_text(encoding='utf-8')
        lines = text.split('\n')
        start = next((i for i, l in enumerate(lines) if l.strip().startswith('## The rails')), None)
        end = next((i for i, l in enumerate(lines[start+1:], start+1) if l.strip().startswith('## ')), None) if start is not None else None
        table = '\n'.join(lines[start:end]).strip() if start is not None and end else ''
        print(table)
        PY
        )
        hash=$(printf '%s' "$table" | sha256sum | cut -c1-16)
        echo "pr_hash=$hash" >> "$GITHUB_OUTPUT"
        echo "PR audit hash: $hash"
    - name: Resolve baseline run on main
      id: baseline
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" \
          --workflow CI --branch main --event push --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId // empty')
        echo "baseline_run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Baseline CI run on main: ${run_id:-none}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Fetch main's audit table from the baseline commit
      id: main
      if: steps.baseline.outputs.baseline_run_id != ''
      run: |
        git fetch --no-tags --depth=1 origin main
        table=$(git show origin/main:docs/real-money-safety-audit.md | python3 - <<'PY'
        import sys
        text = sys.stdin.read()
        lines = text.split('\n')
        start = next((i for i, l in enumerate(lines) if l.strip().startswith('## The rails')), None)
        end = next((i for i, l in enumerate(lines[start+1:], start+1) if l.strip().startswith('## ')), None) if start is not None else None
        table = '\n'.join(lines[start:end]).strip() if start is not None and end else ''
        print(table)
        PY
        )
        hash=$(printf '%s' "$table" | sha256sum | cut -c1-16)
        echo "main_hash=$hash" >> "$GITHUB_OUTPUT"
        echo "main audit hash: $hash"
    - name: Post the rail diff comment on the PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pr_hash="${{ steps.pr.outputs.pr_hash }}"
        main_hash="${{ steps.main.outputs.main_hash || 'unknown' }}"
        run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        {
          echo "## 🛡 Safety-rail audit"
          echo ""
          if [ "$main_hash" = "$pr_hash" ]; then
            echo "Coverage table unchanged vs main (\`$pr_hash\`) — no rail changes in this PR."
            icon="✅"
          elif [ "$main_hash" = "unknown" ]; then
            echo "No baseline on main yet — PR table hash \`$pr_hash\`."
            icon="ℹ️"
          else
            echo "**Rail coverage changed** vs main: \`$main_hash\` → \`$pr_hash\`. Review the audit tables: [docs/real-money-safety-audit.md](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/docs/real-money-safety-audit.md)"
            icon="⚠"
          fi
          echo ""
          echo "The real-money gate rails (kill switch, governor, real-money gate, risk engine) cover every \\\(BuyAsync\\) call site; the audit hash changes whenever that coverage changes."
          echo "<!-- safety-audit-diff -->"
        } > comment.md
        cat comment.md
        number="${{ github.event.pull_request.number }}"
        repo="${{ github.repository }}"
        comment_id=$(gh api "repos/$repo/issues/$number/comments" \
          --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("safety-audit-diff")) | .id' | tail -1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          echo "Updated safety-audit comment $comment_id"
        else
          gh pr comment "$number" --repo "$repo" --body-file comment.md
        fi
