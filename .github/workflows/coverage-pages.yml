name: Coverage Pages

# Publishes the merged HTML coverage report to GitHub Pages, reusing the
# cobertura artifacts the CI run already produced — tests are not re-run here.
#
# PAUSED: the repository is private and GitHub Pages for private repos needs a
# paid plan ("Your current plan does not support GitHub Pages"). The workflow
# no longer runs automatically; trigger it manually from Actions → Coverage
# Pages → Run workflow (it picks up the latest successful CI run on main and
# publishes the report). The merged report is also always downloadable as the
# `coverage-report` artifact of each CI run.
#
# To re-enable automatic publication after upgrading the plan: create the
# Pages site (Settings → Pages → Build and deployment → Source: GitHub
# Actions, or POST /repos/{owner}/{repo}/pages {"build_type":"workflow"}) and
# restore the workflow_run trigger below.

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]

permissions:
  contents: read
  actions: read # read CI runs / download their artifacts
  pages: write
  id-token: write # OIDC deployment to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    # On manual dispatch there is no triggering CI run, so resolve the latest
    # successful CI run on main instead.
    - name: Resolve latest successful CI run
      if: ${{ github.event_name == 'workflow_dispatch' }}
      id: ci_run
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" \
          --workflow CI --branch main --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId')
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Publishing coverage from CI run $run_id"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dotnet tools
      run: dotnet tool restore

    - name: Download coverage artifacts from the CI run
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ steps.ci_run.outputs.run_id || github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pattern: coverage-*
        path: ./coverage
        merge-multiple: true

    # bash: pwsh mangles -name:"value" into two arguments, which
    # ReportGenerator rejects with "No report files specified".
    - name: Generate merged HTML coverage report
      shell: bash
      run: dotnet tool run reportgenerator -- -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./site" -reporttypes:"HtmlInline_AzurePipelines;TextSummary"

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
