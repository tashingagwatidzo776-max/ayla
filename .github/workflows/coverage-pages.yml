name: Coverage Pages

# Publishes the merged HTML coverage report to GitHub Pages after every
# successful CI run on main (a push to main covers both direct pushes and
# merged pull requests). Reuses the cobertura artifacts the CI run already
# produced — tests are not re-run here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # download artifacts from the triggering CI run
  pages: write
  id-token: write # OIDC deployment to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dotnet tools
      run: dotnet tool restore

    - name: Download coverage artifacts from the CI run
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pattern: coverage-*
        path: ./coverage
        merge-multiple: true

    - name: Generate merged HTML coverage report
      run: dotnet tool run reportgenerator -- -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./site" -reporttypes:"HtmlInline_AzurePipelines;TextSummary"

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
