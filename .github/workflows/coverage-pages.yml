name: Coverage Pages

# Publishes the merged HTML coverage report to GitHub Pages, reusing the
# cobertura artifacts the CI run already produced — tests are not re-run here.
#
# Runs automatically after every successful CI run on main, and can also be
# triggered manually from Actions → Coverage Pages → Run workflow (it then
# picks up the latest successful CI run on main and publishes the report).
# Site: https://tashingagwatidzo776-max.github.io/ayla/
#
# Pages needs a public repo on the free plan — the repo was made public and
# the site created via POST /repos/{owner}/{repo}/pages {"build_type":"workflow"}
# (Settings → Pages → Source: GitHub Actions shows the same toggle). Do not
# delete the Pages site or flip the repo back to private, or auto-publish
# breaks again; the merged report remains downloadable as the `coverage-report`
# artifact of each CI run either way.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # read CI runs / download their artifacts
  pages: write
  id-token: write # OIDC deployment to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7

    # On manual dispatch there is no triggering CI run, so resolve the latest
    # successful CI run on main instead.
    - name: Resolve latest successful CI run
      if: ${{ github.event_name == 'workflow_dispatch' }}
      id: ci_run
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" \
          --workflow CI --branch main --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId')
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Publishing coverage from CI run $run_id"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore dotnet tools
      run: dotnet tool restore

    - name: Download coverage artifacts from the CI run
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ steps.ci_run.outputs.run_id || github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pattern: coverage-*
        path: ./coverage
        merge-multiple: true

    # bash: pwsh mangles -name:"value" into two arguments, which
    # ReportGenerator rejects with "No report files specified".
    - name: Generate merged HTML coverage report
      shell: bash
      run: dotnet tool run reportgenerator -- -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./site" -reporttypes:"HtmlInline_AzurePipelines;TextSummary"

    - name: Download coverage trend history
      continue-on-error: true # no coverage-trend artifact yet -> single-point fallback below
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ steps.ci_run.outputs.run_id || github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        name: coverage-trend
        path: ./trend

    # CI has been uploading the history CSV since the trend feature landed;
    # the fallback synthesizes a single point from this run's own summary so
    # the page works even before the next CI run.
    - name: Collect trend data
      shell: bash
      run: |
        mkdir -p ./site
        if [ -f ./trend/coverage-trend.csv ]; then
          cp ./trend/coverage-trend.csv ./site/coverage-trend.csv
        else
          echo 'No coverage-trend artifact; synthesizing a single point from this run'
          pct=$(grep -E '^  Line coverage:' ./site/Summary.txt | awk '{print $3}' | tr -d '%')
          printf 'epoch_seconds,run_id,line_coverage\n' > ./site/coverage-trend.csv
          [ -n "$pct" ] && printf '%s,%s,%s\n' "$(date +%s)" "${{ steps.ci_run.outputs.run_id || github.event.workflow_run.id }}" "$pct" >> ./site/coverage-trend.csv
        fi
        # Bankroll trajectory (optional): the trade store lives on the machine
        # where the app runs, so its export is a committed file refreshed by
        # scripts/export_bankroll.py (see that script's docstring). A missing
        # file simply means the chart has no money axis yet.
        if [ -f ./docs/growth-bankroll.csv ]; then
          cp ./docs/growth-bankroll.csv ./site/growth-bankroll.csv
        fi
        cat ./site/coverage-trend.csv

    - name: Generate the coverage trend page
      env:
        GATE: '60'
      run: python scripts/generate_trend.py

    # health.json + health-status.html describe the run being published:
    # gate passing + zero open ci-drift issues = healthy. The README
    # dashboard links here as the live status page.
    - name: Generate the pipeline health page
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PAGES_RUN_ID: ${{ steps.ci_run.outputs.run_id || github.event.workflow_run.id }}
        PAGES_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
      run: python scripts/generate_health.py

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
